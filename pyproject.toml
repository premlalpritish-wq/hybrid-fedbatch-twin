[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-fedbatch-twin"
version = "0.1.0"
description = "Hybrid Mechanistic-ML Bioreactor State-Estimator combining Monod/Luedeking-Piret kinetics with a Physics-Informed Neural ODE residual corrector."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.1.0",
    "streamlit>=1.35.0",
    "altair>=5.2.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.30.0",
    "mcp>=1.2.0",
]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
hybrid-fedbatch-twin = "hybrid_fedbatch_twin.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hybrid_fedbatch_twin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
