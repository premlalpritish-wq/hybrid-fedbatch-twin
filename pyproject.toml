[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-fedbatch-twin"
version = "0.1.0"
description = "Hybrid Mechanistic-ML Bioreactor State-Estimator combining Monod/Luedeking-Piret kinetics with a Physics-Informed Neural ODE residual corrector."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.1.0",
    "streamlit>=1.35.0",
    "altair>=5.2.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.30.0",
    "mcp>=2.3.0",
]
agents = [
    "langgraph>=0.2.0",
]
mlops = [
    "prefect>=3.0.0",
    "mlflow>=2.16.0",
]
observability = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "prometheus-client>=0.21.0",
]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
hybrid-fedbatch-twin = "hybrid_fedbatch_twin.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hybrid_fedbatch_twin*", "api*", "mcp_server*", "agents*", "mlops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "hygiene: fast repository, gitignore, bundle, and ALCOA+ artifact consistency guardrails",
    "unit: fast standalone physics, numerical, and adjoint unit checks",
    "contract: fast persistence, API/MCP schema, truth-isolation, and OOD/fallback contract tests",
    "agent: fast CAPA deviation graph observability, Part 11, and faithfulness evaluation tests",
    "mlops: fast Medallion ETL, offline MLOps registry, and telemetry hook tests",
    "validation: GxP traceability matrix (RTM) and regulatory validation package checks",
    "slow: heavy multi-minute Stage-1/Stage-2 training, full closed-loop simulation, and benchmark tests",
]
