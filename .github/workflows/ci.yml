name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with service and dev dependencies
        run: pip install -e ".[service,dev]"

      - name: Run FastAPI, persistence, MCP, and CAPA agent eval suites
        run: pytest tests/test_service_and_mcp.py tests/test_agent_evals.py -v

      - name: Run core physics boundary non-negativity regression check
        run: pytest tests/test_hybrid_twin.py -k test_boundary_nonnegativity_and_overflow_stoichiometry -v
